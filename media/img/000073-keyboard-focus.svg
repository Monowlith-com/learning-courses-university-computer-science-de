<text x="187" y="418" fill="#2976BD" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Blauer Rahmen = Fokus</text>
<text x="46" y="560" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Jede Funktion braucht verständliche Namen und echte Tastaturbedienung.</text>
