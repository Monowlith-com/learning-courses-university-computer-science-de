<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Ein zugängliches Formular mit beschriftetem Eingabefeld, sichtbarem Tastaturfokus und einer lesbaren Speichern-Taste. Die Skizze ist kein vollständiger Barrierefreiheitstest.">
<title>Bedienbar ohne Maus</title>
<desc>Ein zugängliches Formular mit beschriftetem Eingabefeld, sichtbarem Tastaturfokus und einer lesbaren Speichern-Taste. Die Skizze ist kein vollständiger Barrierefreiheitstest.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2976BD"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8793A6"/></marker></defs>
<rect width="960" height="600" fill="#FFFFFF"/>
<rect x="16" y="16" width="928" height="568" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="44" y="62" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Bedienbar ohne Maus</text>
<text x="44" y="91" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Sichtbarer Tastaturfokus und klare Beschriftung</text>
<line x1="42" y1="107" x2="918" y2="107" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round"/>
