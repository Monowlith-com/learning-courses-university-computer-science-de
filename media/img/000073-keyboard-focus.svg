<text x="187" y="219" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">Name des Projekts</text>
<rect x="185" y="239" width="590" height="77" rx="5" fill="#FFFFFF" stroke="#2976BD" stroke-width="4"/>
<text x="211" y="289" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Studiennotizen</text>
<text x="188" y="356" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Tabulator → nächstes Bedienelement</text>
<rect x="516" y="381" width="258" height="80" rx="9" fill="#F5F8FC" stroke="#CBD5E1" stroke-width="2"/>
