<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Nach erfolgreicher Authentifizierung prüft das System die Autorisierung für die konkrete Bestellung. Fremde Bestellungen bleiben ohne entsprechende Rechte gesperrt.">
<title>Identität ≠ Berechtigung</title>
<desc>Nach erfolgreicher Authentifizierung prüft das System die Autorisierung für die konkrete Bestellung. Fremde Bestellungen bleiben ohne entsprechende Rechte gesperrt.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2976BD"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8793A6"/></marker></defs>
<rect width="960" height="600" fill="#FFFFFF"/>
<rect x="16" y="16" width="928" height="568" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="44" y="62" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Identität ≠ Berechtigung</text>
<text x="44" y="91" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Anmeldung und Zugriff auf eine Bestellung</text>
<line x1="42" y1="107" x2="918" y2="107" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round"/>
<rect x="50" y="215" width="230" height="146" rx="9" fill="#F5F8FC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="165.0" y="268" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Anmeldung</text>
<text x="165.0" y="311" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Identität nachweisen</text>
<rect x="362" y="215" width="230" height="146" rx="9" fill="#F5F8FC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="477.0" y="268" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Berechtigung</text>
<text x="477.0" y="311" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Rolle / Eigentümer</text>
<rect x="674" y="215" width="230" height="146" rx="9" fill="#F5F8FC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="789.0" y="268" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Bestellung</text>
<text x="789.0" y="311" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Ressource</text>
<line x1="280" y1="285" x2="351" y2="285" stroke="#2976BD" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="593" y1="285" x2="664" y2="285" stroke="#2976BD" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="165" y="195" fill="#2976BD" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Wer bist du?</text>
<text x="477" y="195" fill="#2976BD" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Darfst du das?</text>
<rect x="265" y="412" width="438" height="75" rx="9" fill="#EAF4FF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="484" y="446" fill="#2976BD" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Angemeldet  ≠  überall berechtigt</text>
<text x="46" y="560" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sicherheitsentscheidung stets am konkreten Objekt / Vorgang treffen.</text>
</svg>
