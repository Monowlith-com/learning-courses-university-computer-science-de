<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Endlicher Automat – endet die Binärfolge auf 1?</title><desc>Deterministischer Automat mit Zustand q0 für letzte Ziffer 0 oder Start, q1 für letzte Ziffer 1 und akzeptierendem Doppelkreis. Übergänge korrekt für 0 und 1.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Endlicher Automat – endet die Binärfolge auf 1?</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Zustandsübergänge bei jedem gelesenen Zeichen</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><line x1="103.00" y1="335.00" x2="219.00" y2="335.00" stroke="#61758a" stroke-width="2" stroke-linecap="round" /><polygon points="219.00,335.00 207.00,328.00 207.00,342.00" fill="#61758a" stroke="#61758a" stroke-width="2" /><circle cx="285.00" cy="335.00" r="66" fill="#dcecff" stroke="#286fba" stroke-width="3" /><circle cx="595.00" cy="335.00" r="66" fill="#ffe7cf" stroke="#bc6924" stroke-width="3" /><circle cx="595.00" cy="335.00" r="57" fill="none" stroke="#bc6924" stroke-width="2" /><text x="285" y="344" fill="#253d59" font-size="28" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">q₀</text><text x="595" y="344" fill="#253d59" font-size="28" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">q₁</text><line x1="355.00" y1="315.00" x2="523.00" y2="315.00" stroke="#286fba" stroke-width="3" stroke-linecap="round" /><polygon points="523.00,315.00 510.00,308.00 510.00,322.00" fill="#286fba" stroke="#286fba" stroke-width="2" /><text x="440" y="299" fill="#286fba" font-size="20" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">1</text><line x1="523.00" y1="363.00" x2="355.00" y2="363.00" stroke="#bc6924" stroke-width="3" stroke-linecap="round" /><polygon points="355.00,363.00 368.00,356.00 368.00,370.00" fill="#bc6924" stroke="#bc6924" stroke-width="2" /><text x="440" y="398" fill="#bc6924" font-size="20" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">0</text><polyline points="253.00,277.00 236.00,223.00 336.00,223.00 319.00,278.00" fill="none" stroke="#286fba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="285" y="204" fill="#286fba" font-size="20" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">0</text><polyline points="562.00,277.00 546.00,223.00 646.00,223.00 629.00,278.00" fill="none" stroke="#bc6924" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="595" y="204" fill="#bc6924" font-size="20" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">1</text><text x="285" y="500" fill="#286fba" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Start: q₀</text><text x="595" y="500" fill="#bc6924" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Akzeptiert: q₁</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Beispiel: 101 endet auf 1 → akzeptiert. 100 endet auf 0 → abgelehnt.</text></svg>