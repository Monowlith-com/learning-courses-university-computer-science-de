<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="titel beschreibung">
<title id="titel">HTTPS über TCP mit TLS 1.3</title><desc id="beschreibung">Vereinfachter Ablauf ohne Wiederaufnahme. Im Hello-Austausch tauschen Browser und Server Schlüsselanteile aus. Danach folgen verschlüsselte Authentisierung und Finished, dann HTTP-Anwendungsdaten.</desc>
<defs><marker id="pfeil" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#43516b"/></marker></defs>
<rect x="0" y="0" width="960" height="510" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<g font-family="system-ui, sans-serif">
<text x="34" y="51" text-anchor="start" font-size="31" font-weight="700" fill="#182338">HTTPS über TCP mit TLS 1.3</text>
<text x="35" y="84" text-anchor="start" font-size="21" font-weight="400" fill="#43516b">Beispiel mit Serverzertifikat, ohne Wiederaufnahme und 0-RTT</text>
<rect x="75" y="105" width="190" height="43" rx="14" fill="#dceafe" stroke="#bac5d4" stroke-width="2"/>
<rect x="695" y="105" width="190" height="43" rx="14" fill="#dceafe" stroke="#bac5d4" stroke-width="2"/>
<text x="170" y="133" text-anchor="middle" font-size="22" font-weight="700" fill="#182338">Browser</text>
<text x="790" y="133" text-anchor="middle" font-size="22" font-weight="700" fill="#182338">Server</text>
<line x1="170" y1="151" x2="170" y2="438" stroke="#43516b" stroke-width="2" stroke-dasharray="7 7"/>
<line x1="790" y1="151" x2="790" y2="438" stroke="#43516b" stroke-width="2" stroke-dasharray="7 7"/>
<text x="480" y="175" text-anchor="middle" font-size="19" font-weight="400" fill="#182338">TCP-Verbindung steht</text>
<line x1="174" y1="184" x2="782" y2="184" stroke="#43516b" stroke-width="2"/>
<text x="480" y="224" text-anchor="middle" font-size="19" font-weight="400" fill="#182338">ClientHello mit Schlüsselanteil</text>
<line x1="174" y1="233" x2="782" y2="233" stroke="#43516b" stroke-width="2" marker-end="url(#pfeil)"/>
<text x="480" y="273" text-anchor="middle" font-size="19" font-weight="400" fill="#182338">ServerHello mit Schlüsselanteil</text>
<line x1="786" y1="282" x2="178" y2="282" stroke="#43516b" stroke-width="2" marker-end="url(#pfeil)"/>
<text x="480" y="322" text-anchor="middle" font-size="19" font-weight="400" fill="#182338">Server: Zertifikat, Signatur und Finished (verschlüsselt)</text>
<line x1="786" y1="331" x2="178" y2="331" stroke="#43516b" stroke-width="2" marker-end="url(#pfeil)"/>
<text x="480" y="371" text-anchor="middle" font-size="19" font-weight="400" fill="#182338">Client: Finished (verschlüsselt)</text>
<line x1="174" y1="380" x2="782" y2="380" stroke="#43516b" stroke-width="2" marker-end="url(#pfeil)"/>
<text x="480" y="420" text-anchor="middle" font-size="19" font-weight="400" fill="#182338">HTTP-Anfrage als verschlüsselte Anwendungsdaten</text>
<line x1="174" y1="429" x2="782" y2="429" stroke="#43516b" stroke-width="2" marker-end="url(#pfeil)"/>
<text x="35" y="477" text-anchor="start" font-size="19" font-weight="400" fill="#43516b">HTTP/3 verwendet QUIC und integriert TLS in diesen Transport.</text>
</g></svg>
