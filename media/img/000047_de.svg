<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="titel beschreibung">
<title id="titel">Zugriffsrechte vor der Kontextübergabe</title><desc id="beschreibung">Beispiel für autorisierten Abruf. Die Anwendung ermittelt die Rechte, sucht innerhalb des zulässigen Bestands und prüft die ausgewählten Treffer vor dem Modellaufruf erneut. Vertrauliche Treffer gelangen nicht in den Kontext.</desc>
<defs><marker id="pfeil" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#43516b"/></marker></defs>
<rect x="0" y="0" width="960" height="510" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<g font-family="system-ui, sans-serif">
<text x="34" y="51" text-anchor="start" font-size="31" font-weight="700" fill="#182338">Zugriffsrechte vor der Kontextübergabe</text>
<text x="35" y="85" text-anchor="start" font-size="21" font-weight="400" fill="#43516b">Beispielfrage: Welche Aufbewahrungsfrist gilt für Projektdateien?</text>
<rect x="36" y="115" width="265" height="120" rx="14" fill="#dceafe" stroke="#bac5d4" stroke-width="2"/>
<text x="168" y="149" text-anchor="middle" font-size="23" font-weight="700" fill="#182338">1  Anfrage + Identität</text>
<text x="168" y="179" text-anchor="middle" font-size="18" font-weight="400" fill="#182338">Die Anwendung ermittelt</text>
<text x="168" y="203" text-anchor="middle" font-size="18" font-weight="400" fill="#182338">die Rechte dieser Person.</text>
<rect x="347" y="115" width="265" height="120" rx="14" fill="#dceafe" stroke="#bac5d4" stroke-width="2"/>
<text x="479" y="149" text-anchor="middle" font-size="23" font-weight="700" fill="#182338">2  Autorisierte Suche</text>
<text x="479" y="179" text-anchor="middle" font-size="18" font-weight="400" fill="#182338">Die Suche filtert auf</text>
<text x="479" y="203" text-anchor="middle" font-size="18" font-weight="400" fill="#182338">freigegebene Dokumente.</text>
<rect x="658" y="115" width="265" height="120" rx="14" fill="#d9f0e8" stroke="#bac5d4" stroke-width="2"/>
<text x="790" y="149" text-anchor="middle" font-size="23" font-weight="700" fill="#182338">3  Kontext prüfen</text>
<text x="790" y="179" text-anchor="middle" font-size="18" font-weight="400" fill="#182338">Nur gültige und erlaubte</text>
<text x="790" y="203" text-anchor="middle" font-size="18" font-weight="400" fill="#182338">Treffer weiterreichen.</text>
<line x1="306" y1="176" x2="335" y2="176" stroke="#43516b" stroke-width="2" marker-end="url(#pfeil)"/>
<line x1="617" y1="176" x2="646" y2="176" stroke="#43516b" stroke-width="2" marker-end="url(#pfeil)"/>
<rect x="85" y="293" width="352" height="116" rx="14" fill="#fff0d8" stroke="#bac5d4" stroke-width="2"/>
<text x="261" y="327" text-anchor="middle" font-size="23" font-weight="700" fill="#182338">Ausgeschlossen</text>
<text x="261" y="357" text-anchor="middle" font-size="18" font-weight="400" fill="#182338">Personalakte: keine Leseberechtigung</text>
<text x="261" y="381" text-anchor="middle" font-size="18" font-weight="400" fill="#182338">Bleibt außerhalb des Modellkontexts.</text>
<rect x="523" y="293" width="352" height="116" rx="14" fill="#d9f0e8" stroke="#bac5d4" stroke-width="2"/>
<text x="699" y="327" text-anchor="middle" font-size="23" font-weight="700" fill="#182338">An das Sprachmodell</text>
<text x="699" y="357" text-anchor="middle" font-size="18" font-weight="400" fill="#182338">Gültige Richtlinie und Quell-ID</text>
<text x="699" y="381" text-anchor="middle" font-size="18" font-weight="400" fill="#182338">Antwort anhand erlaubter Auszüge.</text>
<line x1="790" y1="239" x2="790" y2="282" stroke="#43516b" stroke-width="2" marker-end="url(#pfeil)"/>
<text x="35" y="467" text-anchor="start" font-size="19" font-weight="400" fill="#43516b">Die Anwendung setzt die Rechte durch. Das Modell erhält nur die Auswahl.</text>
</g></svg>
