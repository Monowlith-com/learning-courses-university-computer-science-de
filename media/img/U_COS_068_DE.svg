<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Potenzmengen und DFA-Minimierung"><title>Potenzmengen und DFA-Minimierung</title><rect width="900" height="440" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif" fill="#172c43"><text x="450" y="39" text-anchor="middle" font-size="25">Potenzmengen und DFA-Minimierung</text><rect x="107" y="68" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="190" y="99" text-anchor="middle" font-size="19">NFA-Menge</text><rect x="282" y="68" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="365" y="99" text-anchor="middle" font-size="19">0</text><rect x="457" y="68" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="540" y="99" text-anchor="middle" font-size="19">1</text><rect x="632" y="68" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="715" y="99" text-anchor="middle" font-size="19">Ende?</text><rect x="107" y="119" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="190" y="150" text-anchor="middle" font-size="19">A = {0}</text><rect x="282" y="119" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="365" y="150" text-anchor="middle" font-size="19">B</text><rect x="457" y="119" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="540" y="150" text-anchor="middle" font-size="19">C</text><rect x="632" y="119" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="715" y="150" text-anchor="middle" font-size="19">Nein</text><rect x="107" y="170" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="190" y="201" text-anchor="middle" font-size="19">B = {0,2}</text><rect x="282" y="170" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="365" y="201" text-anchor="middle" font-size="19">B</text><rect x="457" y="170" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="540" y="201" text-anchor="middle" font-size="19">C</text><rect x="632" y="170" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="715" y="201" text-anchor="middle" font-size="19">Nein</text><rect x="107" y="221" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="190" y="252" text-anchor="middle" font-size="19">C = {0,1}</text><rect x="282" y="221" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="365" y="252" text-anchor="middle" font-size="19">B</text><rect x="457" y="221" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="540" y="252" text-anchor="middle" font-size="19">C</text><rect x="632" y="221" width="166" height="45" rx="4" fill="#e4eaf3" stroke="#64748b"/><text x="715" y="252" text-anchor="middle" font-size="19">Ja</text><text x="450" y="313" text-anchor="middle" font-size="22">Minimierung: A und B → X; C → Y</text><text x="450" y="358" text-anchor="middle" font-size="25">X, Y: 0 → X, 1 → Y</text><text x="450" y="399" text-anchor="middle" font-size="20">Start X · Ende Y</text></g></svg>