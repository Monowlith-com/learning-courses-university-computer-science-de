<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-label="Post-Quanten-Migration: Inventar, Priorisierung, Umstellung und Verifikation">
<rect width="900" height="675" fill="#ffffff"/>
<style>.t{font:600 28px system-ui,Arial,sans-serif;fill:#243246}.sub{font:18px system-ui,Arial,sans-serif;fill:#45556c}.note{font:17px system-ui,Arial,sans-serif;fill:#475569}.label{font:600 19px system-ui,Arial,sans-serif;fill:#203754}</style>
<text x="48" y="64" class="t" >Post-Quanten-Sicherheit: Migration in Schritten</text>
<text x="48" y="99" class="sub" >Vom Systeminventar zur kontrollierten Umstellung</text>
